# Temporary: measure handler.ps1 apply speed on a Windows runner. Removed after measuring.
name: bench
on:
  push:
    branches: ['claude/**']
    paths: ['win-cursor/bench_apply.ps1', 'win-cursor/handler.ps1', '.github/workflows/bench.yml']
jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bench
        shell: pwsh
        run: |
          cmd /c "git show ad926dea:win-cursor/handler.ps1 > win-cursor\handler.old.ps1"
          foreach ($r in 1..2) { "--- round $r"; powershell -NoProfile -ExecutionPolicy Bypass -File win-cursor/bench_apply.ps1 }
