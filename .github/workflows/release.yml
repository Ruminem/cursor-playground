# SPDX-License-Identifier: Apache-2.0
# 태그(v*)를 밀면 빌드해서 zip 을 만들고, CHANGELOG 의 그 버전 절을 본문으로 릴리스를 낸다.
# 배포마다 같은 글을 두 번 쓰지 않으려고 둔다 — CHANGELOG 를 먼저 쓰고 태그를 민다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '이미 밀어 둔 태그 이름 (예: v1.1.0)'
        required: true

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: cursor-playground   # zip 을 풀면 이 이름의 폴더 하나가 나오게
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # dist/ 는 커밋하지 않으므로 여기서 만든다. 이게 있어야 zip 만으로 열한 가지 모양을 다 깐다
      - name: 빌드
        working-directory: cursor-playground/win-cursor
        run: python build.py

      - name: zip 으로 묶고 릴리스 노트 꺼내기
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd /c rd /s /q cursor-playground\.git
          Get-ChildItem cursor-playground -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # 커서 파일은 이미 PNG 로 압축돼 있어 세게 조여도 안 줄어든다. 러너에 깔린 7-Zip 을 빠른 단계로
          7z a -tzip -mx=1 "cursor-playground-$env:TAG.zip" cursor-playground | Select-Object -Last 2

          $ver = [regex]::Escape(($env:TAG -replace '^v', ''))  # 괄호를 빼면 -replace 가 인자로 쪼개져 빈 버전이 된다
          # 파일이 아예 없으면 Get-Content 가 먼저 죽어 아래 안내까지 못 간다
          $cl = 'cursor-playground\CHANGELOG.md'
          if (-not (Test-Path $cl)) { Write-Host "$cl 이 없음. 태그가 가리키는 커밋에 CHANGELOG 가 있어야 한다"; exit 1 }
          $md = Get-Content $cl -Raw -Encoding UTF8
          $m = [regex]::Match($md, "(?ms)^## v?$ver\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { Write-Host "CHANGELOG.md 에 $env:TAG 절이 없음. 먼저 적고 태그를 다시 밀 것"; exit 1 }
          $m.Groups[1].Value.Trim() | Set-Content notes.md -Encoding utf8   # pwsh 의 utf8 은 BOM 없음

          gh release create $env:TAG "cursor-playground-$env:TAG.zip" `
            --repo $env:GITHUB_REPOSITORY --notes-file notes.md
