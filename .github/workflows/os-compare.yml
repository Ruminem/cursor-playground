# 임시: 빌드를 리눅스 러너로 옮겨도 되는지 견준다 — 같은 커밋을 윈도우·리눅스에서 캐시 없이 전부 빌드해
# 시간과 산출물 바이트를 모양 폴더마다 찍는다. 견주고 나면 지운다
name: os-compare

on:
  push:
    branches: [claude/build-speed]
    paths: [.github/workflows/os-compare.yml]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 환경
        shell: python
        run: |
          import os, platform, sys, zlib
          print(sys.version, "| zlib", zlib.ZLIB_VERSION, zlib.ZLIB_RUNTIME_VERSION)
          print(platform.platform(), "| 코어", os.cpu_count(), "|", platform.processor())
      - name: 빌드
        working-directory: win-cursor
        run: python build.py --all
      - name: 산출물 해시 (모양 폴더마다)
        working-directory: win-cursor
        shell: python
        run: |
          import hashlib, pathlib
          def digest(root):
              h, n = hashlib.sha256(), 0
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      h.update(p.relative_to(root).as_posix().encode()); h.update(p.read_bytes()); n += 1
              return n, h.hexdigest()[:16]
          dist = pathlib.Path("dist")
          shapes = {d.name for d in dist.iterdir() if (d / "pink").is_dir() or (d / "electric").is_dir()} - {"pink", "electric"}
          for d in sorted(dist.iterdir()):
              if d.name in shapes:
                  print("dist/" + d.name, *digest(d))
          rest = hashlib.sha256()
          for d in sorted(dist.iterdir()):
              if d.name not in shapes:
                  rest.update(d.name.encode()); rest.update(digest(d)[1].encode())
          print("dist/<기본 모양 구성표들>", rest.hexdigest()[:16])
          for d in sorted(pathlib.Path("data").iterdir()):
              print("data/" + d.name, *digest(d))
          print("전체 dist", *digest(dist))
