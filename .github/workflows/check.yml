# SPDX-License-Identifier: Apache-2.0
# main 에 푸시할 때마다 빌드해서 커서 파일이 성한지 보고, 그 결과를 GitHub Pages 에 올린다.
# dist/·data/·preview.html 은 저장소에 커밋하지 않는다 — 여기서 만들어 바로 배포한다.
name: check

on:
  # 세션 브랜치 푸시는 돌리지 않는다. 브랜치가 구운 캐시를 main 이 못 받아 같은 굽기를 두 번 했다
  # (2026-10-16 공룡 10종: 브랜치 #551 178분 + main #552 328분). 브랜치에서 보고 싶으면 Actions 에서 손으로 돌린다
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 표식을 무시하고 다시 구울 구성표·모양 id (쉼표로) — 샤드 시간을 잴 때
        required: false
        default: ''

permissions:
  contents: read      # 올릴 권한은 아래 deploy 잡에만 준다 (build 잡은 PR 코드를 돌린다)

# 같은 브랜치에 연달아 밀면 나중 것만 하면 된다. 브랜치마다 따로 세서 서로 안 막게
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # 러너 콘솔은 cp1252 라 파이썬이 한글을 찍다가 죽는다
  PYTHONUTF8: '1'

jobs:
  # 고화질 칸 굽기를 샤드로 나눈다 — 한 잡에서 구우면 공룡 10종이 328분이었다(2026-10-16 #552).
  # plan 이 캐시의 표식으로 다시 구울 칸을 골라 나누고, shard 들이 동시에 굽고, build 가 받아 모아 나머지를 한다.
  # 바이트가 윈도우 zlib 을 타서 샤드도 윈도우 러너다. 굽는 게 없으면 shard 는 건너뛴다
  plan:
    runs-on: windows-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'   # 아래 build 잡과 같아야 한다 (일감 해시에 sys.version)
      # 표식만 있으면 되지만 표식만 따로 캐시하지 않는다. path·key 는 build 잡과 글자까지 같아야 받아진다
      - uses: actions/cache/restore@v6
        with:
          path: |
            win-cursor/dist
            win-cursor/data
            win-cursor/.build-stamp.json
            win-cursor/.stencils.pkl
          key: cursors-${{ runner.os }}-${{ hashFiles('win-cursor/art/**', 'win-cursor/*.py', 'win-cursor/hdfx/**', 'win-cursor/hdpet/**', 'win-cursor/pic/**', 'win-cursor/*.json', 'win-cursor/preview.tpl.html') }}
          restore-keys: cursors-${{ runner.os }}-
      - id: plan
        name: 다시 구울 고화질 칸을 샤드로 나누기
        shell: pwsh
        working-directory: win-cursor
        run: |
          $f = '${{ inputs.force }}'
          $extra = if ($f) { @('--force', $f) } else { @() }
          python build.py --plan-json $env:RUNNER_TEMP/plan.json @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $n = @((Get-Content $env:RUNNER_TEMP/plan.json -Raw | ConvertFrom-Json).shards).Count
          $list = if ($n) { '[' + ((0..($n - 1)) -join ',') + ']' } else { '[]' }
          "shards=$list" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 1

  # 부분 빌드는 아래 전체 빌드가 지나지 않는 길이라 따로 본다 (CI 1분). 샤드와 같이 돈다
  test:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: 바뀐 자리만 갈아 끼우기가 통째로 만든 것과 같은지
        working-directory: win-cursor
        run: python test_stamp.py

  shard:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: windows-latest
    strategy:
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: ${{ runner.temp }}   # 저장소에 떨어지면 아래 git status 검사에 걸린다
      # 빈 dist 에 제 몫만 굽는다 — 올리는 것이 곧 이 샤드가 구운 파일이다
      - name: 고화질 칸 굽기
        working-directory: win-cursor
        shell: pwsh
        run: python build.py --shard ${{ matrix.i }} $env:RUNNER_TEMP/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.i }}
          path: win-cursor/dist
          retention-days: 1

  build:
    needs: [plan, shard, test]
    # shard 를 건너뛰어도 돈다. 하나라도 실패하면 안 돈다
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    steps:
      # 줄바꿈이 CRLF 로 바뀌면 build.py 결과와 달라져 아래 README 비교가 헛되이 실패한다
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # PNG 압축 결과가 파이썬(zlib) 버전마다 달라서 개발에 쓰는 버전과 맞춘다
          # (올라가는 커서가 러너 환경을 타지 않게. 커밋된 결과와 비교하지는 않는다)
          # 패치까지 박는다 — 일감 해시에 sys.version 이 들어가서 러너가 3.14.7→3.14.8 로 오른 날 캐시를 받고도
          # 전부 다시 구웠다(2026-10-16 #551 178분 · #552 328분). 올릴 때는 release.yml 과 위 잡들과 같이, 다 구울 각오로
          python-version: '3.14.8'

      # 러너는 체크아웃이 새것이라 표식이 없어 커서 6,099개를 매번 처음부터 그렸다.
      # 산출물과 표식을 같이 캐시해 두면 재료가 그대로인 구성표는 건너뛴다. 키가 정확히
      # 안 맞아도 restore-keys 로 옛 캐시를 받아 **바뀐 것만** 다시 그린다
      # (2026-09-19 실측: 잡 10분 03초 → 50초, 그중 빌드 자체는 7초)
      - uses: actions/cache@v6
        with:
          path: |
            win-cursor/dist
            win-cursor/data
            win-cursor/.build-stamp.json
            win-cursor/.stencils.pkl
          key: cursors-${{ runner.os }}-${{ hashFiles('win-cursor/art/**', 'win-cursor/*.py', 'win-cursor/hdfx/**', 'win-cursor/hdpet/**', 'win-cursor/pic/**', 'win-cursor/*.json', 'win-cursor/preview.tpl.html') }}
          restore-keys: cursors-${{ runner.os }}-

      # 샤드가 구운 파일을 캐시에서 받은 dist 위에 덮는다
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.shards != '[]'
        with:
          pattern: shard-*
          path: win-cursor/dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: ${{ runner.temp }}   # 저장소에 떨어지면 아래 git status 검사에 걸린다

      # --baked: 샤드가 구운 칸은 다시 안 굽고 표식만 남긴다. 받은 파일이 없는 칸은 여기서 굽는다
      - name: 빌드
        shell: pwsh
        working-directory: win-cursor
        run: |
          $f = '${{ inputs.force }}'
          $extra = if ($f) { @('--force', $f) } else { @() }
          python build.py --baked $env:RUNNER_TEMP/plan.json @extra

      - name: build.py 가 고친 추적 파일을 커밋했는지
        shell: pwsh
        run: |
          # dist/·data/·preview.html 은 .gitignore 라 여기 안 뜬다. README 구성표·모양 표만 남는다
          $changed = git status --porcelain
          if ($changed) {
            Write-Host 'build.py 가 고친 파일을 커밋하지 않았음. win-cursor 에서 python build.py 를 돌리고 결과까지 커밋할 것:'
            Write-Host $changed
            git --no-pager diff --stat
            exit 1
          }

      - name: 커서 파일을 윈도우가 읽는지
        shell: pwsh  # powershell(5.1) 은 한글이 든 임시 스크립트를 ANSI 로 읽어 깨진다
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Ld {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr LoadCursorFromFile(string name);
            [DllImport("user32.dll")] public static extern bool DestroyCursor(IntPtr h);
          }
          '@
          $files = Get-ChildItem win-cursor\dist -Recurse -File
          $bad = @()
          foreach ($f in $files) {
            $h = [Ld]::LoadCursorFromFile($f.FullName)
            if ($h -eq [IntPtr]::Zero) { $bad += $f.FullName } else { [void][Ld]::DestroyCursor($h) }
          }
          "커서 파일 $($files.Count)개 / 못 읽은 파일 $($bad.Count)개"
          if ($bad.Count) { $bad | ForEach-Object { Write-Host $_ }; exit 1 }
          if ($files.Count -lt 100) { Write-Host '커서 파일이 너무 적음'; exit 1 }

      # handler.ps1 의 C#(색조·클릭 점)은 윈도우 PowerShell 에서만 컴파일된다. handler 가 실제로 도는 5.1 로 돌린다
      - name: 클릭 점을 찍은 커서를 윈도우가 읽는지
        shell: pwsh
        working-directory: win-cursor
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test_dot.ps1

      - name: 구성표 목록과 그림·커서가 맞는지
        shell: pwsh
        working-directory: win-cursor
        run: |
          $schemes = Get-Content schemes.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $shapes = @(Get-Content shapes.json -Raw -Encoding UTF8 | ConvertFrom-Json)
          $slots = 'arrow','help','busy','wait','cross','ibeam','pen','no','ns','we','nwse','nesw','move','up','hand','pin','person'
          $fail = 0
          foreach ($s in $schemes) {
            # 고화질 구성표는 art 그림 없이 hd.py 가 dist 에 바로 굽는다. 커서 파일은 아래에서 본다
            if ($s.hd) { continue }
            foreach ($slot in $slots) {
              if (-not (Test-Path "art\$($s.id)\$slot.txt")) { Write-Host "그림 없음: $($s.id)/$slot.txt"; $fail = 1 }
            }
          }
          # 기본 모양으로만 내는 구성표는 빌드가 정한다(build.CLASSIC_ONLY) — 이펙트 결은 classic_only 표식이 있어도 모양 탭이 있어서
          # 표식이 아니라 모양 data 목록에 있는지로 가른다
          $drawn = @((Get-Content "data\$($shapes[1].id)\index.json" -Raw -Encoding UTF8 | ConvertFrom-Json).data.PSObject.Properties.Name)
          foreach ($shape in $shapes) {
            # 기본 모양은 dist\<구성표>\, 나머지는 dist\<모양>\<구성표>\ 에 들어간다
            $root = if ($shape.id -eq $shapes[0].id) { 'dist' } else { "dist\$($shape.id)" }
            if ($shape.id -ne $shapes[0].id) {
              if (-not (Test-Path "data\$($shape.id)\index.json")) { Write-Host "모양 데이터 없음: $($shape.id)/index.json"; $fail = 1 }
            }
            # 모양이 안 바꾸는 칸은 기본 모양 파일과 같아서 모양 쪽에 두지 않는다 (받을 때 기본 것으로 넘어간다)
            $keep = 'ns','we','nwse','nesw','up','cross','pen','hand'
            $mini = 'help','busy','person','pin'
            foreach ($s in $schemes) {
              # 기본 모양만 있는 구성표는 모양 폴더가 없다. 적용할 때 기본 것으로 넘어간다
              if ($shape.id -ne $shapes[0].id -and $drawn -notcontains $s.id) { continue }
              foreach ($slot in $slots) {
                if ($shape.id -ne $shapes[0].id -and $keep -contains $slot) { continue }
                # 고화질 이펙트 결은 모양 폴더에 화살표만, 펫 결(hdpet\<결>.py)은 화살표와 작은 화살표 칸(hdmini)만 굽는다(build_hd_shape).
                # 나머지 칸은 같은 약속으로 기본 것으로 넘어간다
                if ($shape.id -ne $shapes[0].id -and $s.hd -and $slot -ne 'arrow' -and
                    -not ((Test-Path "hdpet\$($s.hd).py") -and $mini -contains $slot)) { continue }
                $ext = if ($s.animated) { 'ani' } else { 'cur' }
                if (-not (Test-Path "$root\$($s.id)\$slot.$ext")) { Write-Host "커서 없음: $root/$($s.id)/$slot.$ext"; $fail = 1 }
              }
            }
          }
          "구성표 $($schemes.Count)종 x 모양 $($shapes.Count)가지 확인 (기본 17칸, 나머지 모양 9칸)"
          exit $fail

      # 시안 페이지의 맥 버튼은 새로 그리지 않고 이 dist 를 받아 다시 담는다. 커서 파일 꼴이 바뀌면 여기서 걸린다
      - name: 맥용 .cape 버튼이 지금 커서 파일로 구워지는지
        shell: pwsh
        working-directory: win-cursor
        run: node test_mac.js

      # 여기부터 배포. 주소를 지금 그대로 두려고 저장소째로 올린다 (.git 만 덜어낸다)
      - name: .git 덜어내기
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cmd /c rd /s /q .git                       # 읽기 전용 팩 파일이 있어도 지운다
          if (Test-Path .git) { Write-Host '.git 을 못 지웠음'; exit 1 }
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: .

  deploy:
    needs: build
    # 샤드가 건너뛰면 암묵 success() 가 조상까지 봐서 deploy 도 건너뛴다 — build 결과만 본다
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
