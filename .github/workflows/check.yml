# SPDX-License-Identifier: Apache-2.0
# 푸시할 때마다 빌드해서 커서 파일이 성한지 보고, main 이면 그 결과를 GitHub Pages 에 올린다.
# dist/·data/·preview.html 은 저장소에 커밋하지 않는다 — 여기서 만들어 바로 배포한다.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read      # 올릴 권한은 아래 deploy 잡에만 준다 (build 잡은 PR 코드를 돌린다)

# 같은 브랜치에 연달아 밀면 나중 것만 하면 된다. 브랜치마다 따로 세서 서로 안 막게
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # 러너 콘솔은 cp1252 라 파이썬이 한글을 찍다가 죽는다
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 줄바꿈이 CRLF 로 바뀌면 build.py 결과와 달라져 아래 README 비교가 헛되이 실패한다
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # PNG 압축 결과가 파이썬(zlib) 버전마다 달라서 개발에 쓰는 버전과 맞춘다
          # (올라가는 커서가 러너 환경을 타지 않게. 커밋된 결과와 비교하지는 않는다)
          python-version: '3.14'

      # 부분 빌드는 아래 전체 빌드가 지나지 않는 길이라 따로 본다 (몇 초)
      - name: 바뀐 자리만 갈아 끼우기가 통째로 만든 것과 같은지
        working-directory: win-cursor
        run: python test_stamp.py

      # 러너는 체크아웃이 새것이라 표식이 없어 커서 6,099개를 매번 처음부터 그렸다.
      # 산출물과 표식을 같이 캐시해 두면 재료가 그대로인 구성표는 건너뛴다. 키가 정확히
      # 안 맞아도 restore-keys 로 옛 캐시를 받아 **바뀐 것만** 다시 그린다
      # (2026-09-19 실측: 잡 10분 03초 → 50초, 그중 빌드 자체는 7초)
      - uses: actions/cache@v6
        with:
          path: |
            win-cursor/dist
            win-cursor/data
            win-cursor/.build-stamp.json
            win-cursor/.stencils.pkl
          key: cursors-${{ runner.os }}-${{ hashFiles('win-cursor/art/**', 'win-cursor/*.py', 'win-cursor/*.json', 'win-cursor/preview.tpl.html') }}
          restore-keys: cursors-${{ runner.os }}-

      - name: 빌드
        working-directory: win-cursor
        run: python build.py

      - name: build.py 가 고친 추적 파일을 커밋했는지
        shell: pwsh
        run: |
          # dist/·data/·preview.html 은 .gitignore 라 여기 안 뜬다. README 구성표·모양 표만 남는다
          $changed = git status --porcelain
          if ($changed) {
            Write-Host 'build.py 가 고친 파일을 커밋하지 않았음. win-cursor 에서 python build.py 를 돌리고 결과까지 커밋할 것:'
            Write-Host $changed
            git --no-pager diff --stat
            exit 1
          }

      - name: 커서 파일을 윈도우가 읽는지
        shell: pwsh  # powershell(5.1) 은 한글이 든 임시 스크립트를 ANSI 로 읽어 깨진다
        run: |
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Ld {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr LoadCursorFromFile(string name);
            [DllImport("user32.dll")] public static extern bool DestroyCursor(IntPtr h);
          }
          '@
          $files = Get-ChildItem win-cursor\dist -Recurse -File
          $bad = @()
          foreach ($f in $files) {
            $h = [Ld]::LoadCursorFromFile($f.FullName)
            if ($h -eq [IntPtr]::Zero) { $bad += $f.FullName } else { [void][Ld]::DestroyCursor($h) }
          }
          "커서 파일 $($files.Count)개 / 못 읽은 파일 $($bad.Count)개"
          if ($bad.Count) { $bad | ForEach-Object { Write-Host $_ }; exit 1 }
          if ($files.Count -lt 100) { Write-Host '커서 파일이 너무 적음'; exit 1 }

      - name: 구성표 목록과 그림·커서가 맞는지
        shell: pwsh
        working-directory: win-cursor
        run: |
          $schemes = Get-Content schemes.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $shapes = @(Get-Content shapes.json -Raw -Encoding UTF8 | ConvertFrom-Json)
          $slots = 'arrow','help','busy','wait','cross','ibeam','pen','no','ns','we','nwse','nesw','move','up','hand','pin','person'
          $fail = 0
          foreach ($s in $schemes) {
            foreach ($slot in $slots) {
              if (-not (Test-Path "art\$($s.id)\$slot.txt")) { Write-Host "그림 없음: $($s.id)/$slot.txt"; $fail = 1 }
            }
          }
          foreach ($shape in $shapes) {
            # 기본 모양은 dist\<구성표>\, 나머지는 dist\<모양>\<구성표>\ 에 들어간다
            $root = if ($shape.id -eq $shapes[0].id) { 'dist' } else { "dist\$($shape.id)" }
            if ($shape.id -ne $shapes[0].id) {
              if (-not (Test-Path "data\$($shape.id).json")) { Write-Host "모양 데이터 없음: $($shape.id).json"; $fail = 1 }
            }
            # 모양이 안 바꾸는 칸은 기본 모양 파일과 같아서 모양 쪽에 두지 않는다 (받을 때 기본 것으로 넘어간다)
            $keep = 'ns','we','nwse','nesw','up','cross','pen','hand'
            foreach ($s in $schemes) {
              foreach ($slot in $slots) {
                if ($shape.id -ne $shapes[0].id -and $keep -contains $slot) { continue }
                $ext = if ($s.animated) { 'ani' } else { 'cur' }
                if (-not (Test-Path "$root\$($s.id)\$slot.$ext")) { Write-Host "커서 없음: $root/$($s.id)/$slot.$ext"; $fail = 1 }
              }
            }
          }
          "구성표 $($schemes.Count)종 x 모양 $($shapes.Count)가지 확인 (기본 17칸, 나머지 모양 9칸)"
          exit $fail

      # 여기부터 배포. 주소를 지금 그대로 두려고 저장소째로 올린다 (.git 만 덜어낸다)
      - name: .git 덜어내기
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cmd /c rd /s /q .git                       # 읽기 전용 팩 파일이 있어도 지운다
          if (Test-Path .git) { Write-Host '.git 을 못 지웠음'; exit 1 }
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
